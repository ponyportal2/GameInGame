name: Build Windows folder

on:
  push:
    branches: [main]
    paths-ignore:
      - 'GameSmith-Windows/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows-folder:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Git LFS
        shell: bash
        run: |
          set -euo pipefail
          git lfs install --local

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.2'

      - name: Set up Node for globally installed Pi
        uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'

      - name: Install pinned Pi coding agent
        shell: bash
        run: |
          set -euo pipefail
          npm install -g @earendil-works/pi-coding-agent@0.99.2
          test "$(pi --version)" = "0.99.2"

      - name: Download and verify Godot 4.7.2 runtimes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ci-godot
          curl -fL --retry 3 -o .ci-godot/godot-linux.zip \
            https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          echo "cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  .ci-godot/godot-linux.zip" | sha256sum -c -
          unzip -q .ci-godot/godot-linux.zip -d .ci-godot/linux
          chmod +x .ci-godot/linux/Godot_v4.7.2-stable_linux.x86_64

          curl -fL --retry 3 -o .ci-godot/godot-windows.zip \
            https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_win64.exe.zip
          echo "731980f9608d61333e5baf54a2ef17210acc7a538446c0cb9969f002aca1e953  .ci-godot/godot-windows.zip" | sha256sum -c -
          unzip -q .ci-godot/godot-windows.zip -d .ci-godot/windows

      - name: Test launcher and build Windows launcher
        shell: bash
        run: |
          set -euo pipefail
          (cd tools/windows-bootstrap && go test ./...)
          (cd tools/windows-bootstrap && GOOS=windows GOARCH=amd64 CGO_ENABLED=0 \
            go build -trimpath -ldflags='-s -w -H=windowsgui' -o "$GITHUB_WORKSPACE/.ci-godot/GameSmith.exe" .)

      - name: Build GameSmith PCK
        shell: bash
        run: |
          set -euo pipefail
          .ci-godot/linux/Godot_v4.7.2-stable_linux.x86_64 \
            --headless --path . --export-pack "Linux Pack" .ci-godot/GameSmith.pck

      - name: Assemble self-contained Windows folder
        shell: bash
        run: |
          set -euo pipefail
          rm -rf GameSmith-Windows GameSmith-Windows.zip
          mkdir -p GameSmith-Windows/runtime
          cp .ci-godot/GameSmith.exe GameSmith-Windows/GameSmith.exe
          cp .ci-godot/GameSmith.pck GameSmith-Windows/GameSmith.pck
          cp .ci-godot/windows/Godot_v4.7.2-stable_win64.exe \
            GameSmith-Windows/runtime/
          cp THIRD_PARTY_NOTICES.md GameSmith-Windows/
          cat > GameSmith-Windows/README.txt <<'EOF'
          GameSmith for Windows
          =====================

          Double-click GameSmith.exe.

          The Godot 4.7.2 Windows runtime is already bundled under runtime\, so GameSmith does not need to download it during normal startup.

          Git for Windows must be installed and available on PATH for generated-game repositories.
          EOF
          python3 tools/testing/verify_windows_package.py
          sha256sum GameSmith-Windows/GameSmith.exe GameSmith-Windows/GameSmith.pck GameSmith-Windows/runtime/Godot_v4.7.2-stable_win64.exe

      - name: Run full GameSmith verification
        shell: bash
        run: |
          set -euo pipefail
          GODOT_BIN="$GITHUB_WORKSPACE/.ci-godot/linux/Godot_v4.7.2-stable_linux.x86_64" bash tools/testing/run-verification.sh

      - name: Commit refreshed Windows folder to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git lfs track "GameSmith-Windows/runtime/Godot_v4.7.2-stable_win64.exe"
          git add .gitattributes .gitignore GameSmith-Windows
          git add -f GameSmith-Windows/runtime/Godot_v4.7.2-stable_win64.exe
          git add -u GameSmith-Windows.zip || true
          git ls-files --error-unmatch GameSmith-Windows/runtime/Godot_v4.7.2-stable_win64.exe >/dev/null
          git lfs ls-files | grep -F "GameSmith-Windows/runtime/Godot_v4.7.2-stable_win64.exe" >/dev/null
          if git diff --cached --quiet; then
            echo "Windows folder is unchanged."
            exit 0
          fi
          git commit -m "build: refresh self-contained Windows folder [skip ci]"
          git push
