name: Debug Windows bridge claim

on:
  push:
    branches: [fix/windows-bridge-claim-20261013]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: debug-bridge-claim-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-host:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
      - name: Uninterrupted complete host suite
        run: node tools/testing/run-host-tests.mjs GameSmith-Windows/runtime/Godot_v4.7.2-stable_win64.exe

  pi-v1:
    runs-on: windows-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
      - name: Install supported Pi CLI
        run: npm install -g @earendil-works/pi-coding-agent@1.0.0
      - name: Real Pi against deterministic OpenAI-compatible v1 emulator
        env:
          GAMESMITH_PI_TEST_PART: '1'
        run: node tools/testing/run-pi-e2e.mjs GameSmith-Windows/runtime/Godot_v4.7.2-stable_win64.exe
