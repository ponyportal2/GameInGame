name: Verify native Windows runtime

on:
  # Automatic CI is temporarily disabled. Uncomment to re-enable it.
  # push:
  #   branches: [main]
  #   paths-ignore: ['GameSmith-Windows/**']
  # pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
      - name: Install pinned Pi
        run: npm install -g @earendil-works/pi-coding-agent@1.0.0
      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
      - name: Unified verification with complete artifacts
        run: node tools/testing/verify.mjs --suite release --output errors --artifacts "${{ runner.temp }}/gamesmith-verification"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-evidence
          path: ${{ runner.temp }}/gamesmith-verification
