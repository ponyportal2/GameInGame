name: Focused fake-v1 Pi acceptance

on:
  push:
    branches: ['debug/bridge-claim-tdd-20261013']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
      - name: Install pinned Pi
        run: npm install -g @earendil-works/pi-coding-agent@1.0.0
      - name: Bootstrap Godot script classes
        shell: pwsh
        run: GameSmith-Windows/runtime/Godot_v4.7.2-stable_win64.exe --headless --path . --editor --quit
      - name: Run focused fake-v1 provider recovery acceptance
        shell: pwsh
        run: |
          $env:GAMESMITH_PI_TEST_PART='5'
          node tools/testing/run-pi-e2e.mjs GameSmith-Windows/runtime/Godot_v4.7.2-stable_win64.exe pi.cmd
