name: Cline stress debug

on:
  push:
    branches: ['debug/cline-stress-20261013']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stress:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
      - name: Cline Node protocol stress 20x
        shell: pwsh
        run: |
          1..20 | ForEach-Object {
            Write-Host "=== Node Cline iteration $_ ==="
            node --test tests/cline.test.mjs tests/cline-server.test.mjs
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Cline lifecycle isolated 10x
        shell: pwsh
        run: |
          1..10 | ForEach-Object {
            Write-Host "=== Isolated Cline iteration $_ ==="
            node tools/testing/run-host-tests.mjs GameSmith-Windows/runtime/Godot_v4.7.2-stable_win64.exe cline_lifecycle_runner.gd
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $left = Get-CimInstance Win32_Process | Where-Object { $_.CommandLine -match 'fake-cline\.mjs' }
            if ($left) { $left | Format-List ProcessId,ParentProcessId,CommandLine; throw 'Orphan fake Cline process after isolated lifecycle' }
          }
      - name: Predecessor chain through Cline 5x
        shell: pwsh
        run: |
          1..5 | ForEach-Object {
            Write-Host "=== Shared-state predecessor chain iteration $_ ==="
            node tools/testing/run-host-tests.mjs GameSmith-Windows/runtime/Godot_v4.7.2-stable_win64.exe command_code_lifecycle_runner.gd command_code_compaction_runner.gd opencode_lifecycle_runner.gd codex_lifecycle_runner.gd cline_lifecycle_runner.gd
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $left = Get-CimInstance Win32_Process | Where-Object { $_.CommandLine -match 'fake-(command-code|opencode|codex|cline)\.mjs' }
            if ($left) { $left | Format-List ProcessId,ParentProcessId,CommandLine; throw 'Orphan fake harness process after predecessor chain' }
          }
      - name: Upload stress logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cline-stress-logs
          path: ${{ runner.temp }}/gamesmith-tests-*/**
          if-no-files-found: warn
